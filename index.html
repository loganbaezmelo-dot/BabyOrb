<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BabyOrb</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 10px;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      text-align: center;
    }
    #top-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 450px;
      background: #161b22;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      border: 1px solid #30363d;
    }
    #room {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 48vh;
      min-height: 280px;
      background: radial-gradient(circle at 50% 30%, #1e2638, #0e121a);
      border: 2px solid #30363d;
      border-radius: 16px;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #speech-bubble {
      position: absolute;
      background: #fff;
      color: #111;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      display: none;
      white-space: nowrap;
      z-index: 25;
      transform: translate(-50%, -100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
    }
    #orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffd166, #f77f00);
      box-shadow: 0 0 20px rgba(247, 127, 0, 0.45);
      cursor: grab;
      touch-action: none;
      z-index: 10;
      transition: width 0.25s, height 0.25s;
    }
    #orb:active {
      cursor: grabbing;
    }
    .face {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16%;
      transition: transform 0.4s ease, opacity 0.3s;
    }
    .eye {
      background: #111;
      border-radius: 50%;
      width: 15%;
      height: 15%;
    }
    .orb-rioting .face {
      transform: rotateY(180deg);
      opacity: 0;
    }
    #toy {
      position: absolute;
      width: 44px;
      height: 44px;
      font-size: 32px;
      text-align: center;
      line-height: 44px;
      cursor: grab;
      display: none;
      z-index: 5;
      touch-action: none;
    }
    #trash {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 50px;
      height: 50px;
      background: #21262d;
      border: 2px dashed #484f58;
      border-radius: 12px;
      font-size: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    #stash {
      position: absolute;
      bottom: 10px;
      left: 10px;
      display: none;
      gap: 8px;
      font-size: 12px;
      background: rgba(0,0,0,0.6);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid #30363d;
      z-index: 4;
    }
    #shop {
      width: 100%;
      max-width: 450px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      background: #161b22;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 9px 4px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: 0.1s ease;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.97);
      background: #21262d;
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #logs {
      margin-top: 8px;
      width: 100%;
      max-width: 450px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      color: #8b949e;
      text-align: center;
      min-height: 34px;
    }
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, 0.92);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 20px;
      text-align: center;
      gap: 12px;
    }
  </style>
</head>
<body>

  <h1>BabyOrb 💀</h1>

  <div id="top-bar">
    <div>🪙 <span id="coins-display">0</span></div>
    <div>🎂 Age <span id="age-display">0</span></div>
    <div>🍼 <span id="hunger-display">100</span>%</div>
    <div>💧 <span id="thirst-display">100</span>%</div>
  </div>

  <div id="room">
    <div id="speech-bubble"></div>
    <div id="orb">
      <div class="face">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
    </div>

    <div id="toy">🧸</div>
    <div id="trash">🗑️</div>
    <div id="stash">
      <span>🍎 <b id="fruit-count">0</b></span>
      <span>💧 <b id="water-count">0</b></span>
    </div>

    <div id="game-over" class="overlay-screen">
      <div style="font-size: 20px;">💀 Your orb passed away...</div>
      <button class="btn" style="padding: 8px 18px;" onclick="location.reload()">Restart</button>
    </div>

    <div id="win-screen" class="overlay-screen">
      <div style="font-size: 20px;">🎓 Age 4 reached!</div>
      <p style="font-size: 14px; color: #8b949e;">Your orb is fully independent and can care for itself now. You beat the game 😭💀</p>
    </div>
  </div>

  <div id="shop">
    <button class="btn" id="btn-milk" onclick="buyMilk()">🍼 Milk (50c)</button>
    <button class="btn" id="btn-babyfood" onclick="buyBabyFood()">🥣 Baby Food (75c)</button>
    <button class="btn" id="btn-toy" onclick="buyToy()" disabled>🧸 Toy (100c)</button>
    <button class="btn" id="btn-fruit" onclick="buyFruit()" disabled>🍎 5x Fruit (75c)</button>
    <button class="btn" id="btn-water" onclick="buyWater()" disabled>💧 5x Water (60c)</button>
    <button class="btn" id="btn-feed-stash" onclick="feedFromStash()" disabled>🍽️ Feed Stash</button>
  </div>

  <div id="logs">Pet your orb by rubbing your finger over it to get coins!</div>

  <script>
    const gameState = {
      coins: 0,
      age: 0,
      hunger: 100,
      thirst: 100,
      milksFed: 0,
      foodsFed: 0,
      happyCount: 0,
      petCount: 0,
      toyJumps: 0,
      rioting: false,
      hasToy: false,
      toyRotten: false,
      fruitPacks: 0,
      waterPacks: 0,
      fruitsEatenTotal: 0,
      watersDrunkTotal: 0,
      posX: 120,
      posY: 120,
      size: 55,
      vx: 1.5,
      vy: 1.2
    };

    const room = document.getElementById('room');
    const orb = document.getElementById('orb');
    const toy = document.getElementById('toy');
    const trash = document.getElementById('trash');
    const stash = document.getElementById('stash');
    const speech = document.getElementById('speech-bubble');
    const logBox = document.getElementById('logs');

    function log(msg) {
      logBox.innerText = msg;
    }

    function initOrbPosition() {
      const bounds = room.getBoundingClientRect();
      gameState.posX = (bounds.width - gameState.size) / 2;
      gameState.posY = (bounds.height - gameState.size) / 2;
      applyOrbTransform();
    }

    function updateUI() {
      document.getElementById('coins-display').innerText = gameState.coins;
      document.getElementById('age-display').innerText = gameState.age;
      document.getElementById('hunger-display').innerText = Math.max(0, Math.round(gameState.hunger));
      document.getElementById('thirst-display').innerText = Math.max(0, Math.round(gameState.thirst));
      document.getElementById('fruit-count').innerText = gameState.fruitPacks;
      document.getElementById('water-count').innerText = gameState.waterPacks;

      const btnMilk = document.getElementById('btn-milk');
      const btnBabyFood = document.getElementById('btn-babyfood');
      const btnToy = document.getElementById('btn-toy');
      const btnFruit = document.getElementById('btn-fruit');
      const btnWater = document.getElementById('btn-water');
      const btnFeedStash = document.getElementById('btn-feed-stash');

      if (gameState.age === 0) {
        btnMilk.innerText = '🍼 Milk (50c)';
        btnBabyFood.innerText = '🥣 Baby Food (75c)';
        btnToy.disabled = true;
        btnFruit.disabled = true;
        btnWater.disabled = true;
        btnFeedStash.disabled = true;
      } else if (gameState.age === 1) {
        btnToy.disabled = gameState.hasToy || gameState.coins < 100;
        btnFruit.disabled = true;
        btnWater.disabled = true;
        btnFeedStash.disabled = true;
      } else if (gameState.age >= 2) {
        btnMilk.innerText = '🍼 Milk (30c)';
        btnBabyFood.innerText = '🥣 Baby Food (50c)';
        btnToy.disabled = true;
        btnFruit.disabled = gameState.coins < 75;
        btnWater.disabled = gameState.coins < 60;
        btnFeedStash.disabled = (gameState.fruitPacks === 0 && gameState.waterPacks === 0);
      }
    }

    function applyOrbTransform() {
      orb.style.width = gameState.size + 'px';
      orb.style.height = gameState.size + 'px';
      orb.style.left = gameState.posX + 'px';
      orb.style.top = gameState.posY + 'px';
    }

    window.addEventListener('load', () => {
      initOrbPosition();
      updateUI();
    });

    // Petting / Rubbing
    let lastPetX = 0;
    let lastPetY = 0;
    let petDistance = 0;

    orb.addEventListener('pointermove', (e) => {
      if (isDragging) return;
      if (lastPetX !== 0 && lastPetY !== 0) {
        const dist = Math.hypot(e.clientX - lastPetX, e.clientY - lastPetY);
        petDistance += dist;
      }
      lastPetX = e.clientX;
      lastPetY = e.clientY;

      if (petDistance > 50) {
        petDistance = 0;
        let gain = 5;
        if (gameState.age === 1) gain = 3;
        if (gameState.age >= 2) gain = 1;

        gameState.coins += gain;
        gameState.petCount++;

        if (gameState.age === 1 && gameState.petCount >= 20) {
          levelUpToAge2();
        }

        log(`Rubbed orb! +${gain} coins 🪙`);
        updateUI();
      }
    });

    orb.addEventListener('pointerleave', () => {
      lastPetX = 0;
      lastPetY = 0;
    });

    // Pick up / Move mechanic
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    orb.addEventListener('pointerdown', (e) => {
      if (gameState.age < 1) return;
      isDragging = true;
      dragStart = { x: e.clientX, y: e.clientY };
      orb.setPointerCapture(e.pointerId);
    });

    orb.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const moved = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
      if (moved > 30) {
        let gain = gameState.age === 1 ? 10 : 5;
        gameState.coins += gain;
        log(`Moved orb! +${gain} coins 🪙`);
        updateUI();
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const bounds = room.getBoundingClientRect();
      let nx = e.clientX - bounds.left - gameState.size / 2;
      let ny = e.clientY - bounds.top - gameState.size / 2;
      nx = Math.max(0, Math.min(bounds.width - gameState.size, nx));
      ny = Math.max(0, Math.min(bounds.height - gameState.size, ny));
      gameState.posX = nx;
      gameState.posY = ny;
      applyOrbTransform();
    });

    // Shop actions
    function buyMilk() {
      const price = gameState.age >= 2 ? 30 : 50;
      if (gameState.coins >= price) {
        gameState.coins -= price;
        gameState.thirst = Math.min(100, gameState.thirst + 40);
        gameState.milksFed++;
        triggerHappy();
        log('Gave orb warm milk! 🍼');
        checkGrowth();
        updateUI();
      }
    }

    function buyBabyFood() {
      const price = gameState.age >= 2 ? 50 : 75;
      if (gameState.coins >= price) {
        gameState.coins -= price;
        gameState.hunger = Math.min(100, gameState.hunger + 40);
        gameState.foodsFed++;
        triggerHappy();
        log('Fed orb some baby food! 🥣');
        checkGrowth();
        updateUI();
      }
    }

    function buyToy() {
      if (gameState.coins >= 100 && !gameState.hasToy) {
        gameState.coins -= 100;
        gameState.hasToy = true;
        gameState.rioting = false;
        orb.classList.remove('orb-rioting');
        toy.style.display = 'block';
        toy.style.left = '75%';
        toy.style.top = '65%';
        log('Bought a toy! Orb stopped rioting and is happy! 🧸');
        triggerHappy();
        updateUI();
      }
    }

    function buyFruit() {
      if (gameState.coins >= 75) {
        gameState.coins -= 75;
        gameState.fruitPacks += 5;
        log('Bought 5x fruits pack! 🍎');
        updateUI();
      }
    }

    function buyWater() {
      if (gameState.coins >= 60) {
        gameState.coins -= 60;
        gameState.waterPacks += 5;
        log('Bought 5x water pack! 💧');
        updateUI();
      }
    }

    function feedFromStash() {
      let fed = false;
      if (gameState.fruitPacks > 0) {
        gameState.fruitPacks--;
        gameState.hunger = Math.min(100, gameState.hunger + 30);
        gameState.fruitsEatenTotal++;
        fed = true;
      }
      if (gameState.waterPacks > 0) {
        gameState.waterPacks--;
        gameState.thirst = Math.min(100, gameState.thirst + 30);
        gameState.watersDrunkTotal++;
        fed = true;
      }
      if (fed) {
        triggerHappy();
        log('Manually fed orb from supplies!');
        checkGrowth();
        updateUI();
      }
    }

    function triggerHappy() {
      if (gameState.age === 1) {
        gameState.happyCount++;
        if (gameState.happyCount >= 10) {
          levelUpToAge2();
        }
      }
    }

    function checkGrowth() {
      if (gameState.age === 0) {
        if (gameState.milksFed >= 4 && gameState.foodsFed >= 8) {
          levelUpToAge1();
        }
      } else if (gameState.age === 2) {
        if (gameState.fruitsEatenTotal >= 15 && gameState.watersDrunkTotal >= 15) {
          levelUpToAge3();
        }
      }
    }

    function levelUpToAge1() {
      gameState.age = 1;
      gameState.size = 75;
      applyOrbTransform();
      log('🎉 Orb reached Age 1! It moves now and wants a toy!');
      updateUI();
    }

    function levelUpToAge2() {
      gameState.age = 2;
      gameState.size = 95;
      gameState.toyRotten = true;
      toy.innerText = '🤢';
      trash.style.display = 'flex';
      stash.style.display = 'flex';
      applyOrbTransform();
      log('🎉 Orb reached Age 2! The toy got stinky rotten! Drag it to trash! 🗑️');
      updateUI();
    }

    function levelUpToAge3() {
      gameState.age = 3;
      gameState.size = 120;
      applyOrbTransform();
      log('🎉 Orb reached Age 3! It learned how to talk!');
      updateUI();

      setTimeout(() => {
        levelUpToAge4();
      }, 35000);
    }

    function levelUpToAge4() {
      gameState.age = 4;
      gameState.size = 145;
      applyOrbTransform();
      document.getElementById('win-screen').style.display = 'flex';
      updateUI();
    }

    // Drag rotten toy to trash
    let draggingToy = false;
    toy.addEventListener('pointerdown', (e) => {
      if (!gameState.toyRotten) return;
      draggingToy = true;
      toy.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      if (!draggingToy) return;
      const b = room.getBoundingClientRect();
      toy.style.left = (e.clientX - b.left - 22) + 'px';
      toy.style.top = (e.clientY - b.top - 22) + 'px';

      const tRect = trash.getBoundingClientRect();
      if (e.clientX >= tRect.left && e.clientX <= tRect.right &&
          e.clientY >= tRect.top && e.clientY <= tRect.bottom) {
        draggingToy = false;
        toy.style.display = 'none';
        trash.style.display = 'none';
        gameState.hasToy = false;
        gameState.coins += 10;
        log('Threw away the rotten stinky toy! +10 coins 🪙');
        updateUI();
      }
    });

    window.addEventListener('pointerup', () => { draggingToy = false; });

    // Movement & behavior ticks
    setInterval(() => {
      const bounds = room.getBoundingClientRect();
      const maxW = bounds.width - gameState.size;
      const maxH = bounds.height - gameState.size;

      if (gameState.age >= 1 && !isDragging && maxW > 0 && maxH > 0) {
        gameState.posX += gameState.vx;
        gameState.posY += gameState.vy;

        if (gameState.posX <= 0 || gameState.posX >= maxW) {
          gameState.vx *= -1;
          gameState.posX = Math.max(0, Math.min(maxW, gameState.posX));
        }
        if (gameState.posY <= 0 || gameState.posY >= maxH) {
          gameState.vy *= -1;
          gameState.posY = Math.max(0, Math.min(maxH, gameState.posY));
        }

        applyOrbTransform();

        // Toy background play
        if (gameState.hasToy && !gameState.toyRotten) {
          const toyX = toy.offsetLeft;
          const toyY = toy.offsetTop;
          const distToToy = Math.hypot(gameState.posX - toyX, gameState.posY - toyY);
          if (distToToy < 50 && Math.random() < 0.08) {
            gameState.coins += 15;
            triggerHappy();
            log('Orb played with its toy! +15 coins 🪙');
            updateUI();
          }
        }
      }

      // Age 1 Toy tantrums
      if (gameState.age === 1 && !gameState.hasToy) {
        if (Math.random() < 0.04) {
          gameState.toyJumps++;
          gameState.vy = -3;
          log(`Orb jumped demanding a toy! (${gameState.toyJumps}/10)`);
          if (gameState.toyJumps >= 10 && !gameState.rioting) {
            gameState.rioting = true;
            orb.classList.add('orb-rioting');
            log('Orb is rioting! Face flipped backwards 💀');
          }
        }
      }

      // Age 2+ Stash background intake
      if (gameState.age >= 2) {
        if (gameState.hunger < 50 && gameState.fruitPacks > 0) {
          gameState.fruitPacks--;
          gameState.hunger = Math.min(100, gameState.hunger + 30);
          gameState.fruitsEatenTotal++;
          log('Orb grabbed fruit from stash! 🍎');
          checkGrowth();
          updateUI();
        }
        if (gameState.thirst < 50 && gameState.waterPacks > 0) {
          gameState.waterPacks--;
          gameState.thirst = Math.min(100, gameState.thirst + 30);
          gameState.watersDrunkTotal++;
          log('Orb drank water from stash! 💧');
          checkGrowth();
          updateUI();
        }
      }

      // Age 3 Speech bubble
      if (gameState.age === 3) {
        speech.style.left = (gameState.posX + gameState.size / 2) + 'px';
        speech.style.top = (gameState.posY - 10) + 'px';
        if (gameState.hunger < 45) {
          speech.innerText = 'hungry!! 🥣';
          speech.style.display = 'block';
        } else if (gameState.thirst < 45) {
          speech.innerText = 'thirsty!! 💧';
          speech.style.display = 'block';
        } else {
          speech.style.display = 'none';
        }
      } else {
        speech.style.display = 'none';
      }

    }, 30);

    // Vitals decay
    setInterval(() => {
      if (gameState.age === 4) return;

      gameState.hunger -= 1.2;
      gameState.thirst -= 1.5;

      if (gameState.hunger <= 0 || gameState.thirst <= 0) {
        document.getElementById('game-over').style.display = 'flex';
      }
      updateUI();
    }, 1000);
  </script>
</body>
</html>
